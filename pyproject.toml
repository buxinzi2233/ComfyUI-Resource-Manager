[build-system]
requires = ["maturin==1.12.6"]
build-backend = "maturin"

[project]
name = "comfyui-resource-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12,<3", "psutil>=7,<8", "aiohttp>=3.11,<4"]
description = "Worker-dispatched ComfyUI resource controls with a Rust idle policy"

[dependency-groups]
dev = ["maturin==1.12.6", "pytest==9.0.2", "ruff==0.15.7"]

[tool.maturin]
python-source = "."
module-name = "resource_manager._native"
features = ["pyo3/extension-module"]
include = ["resource_manager/web/*.js", "resource_manager/web/*.css", "resource_manager/_native.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --confcutdir=tests"

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "W", "N805", "S307", "S102", "T"]
lint.ignore = ["E501"]
